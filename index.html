<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Tồn Đảo Hoang</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>
    <div id="gameContainer">

```
    <div id="topBar">
        <div class="stat">
            ❤️ <span id="health">100</span>
        </div>

        <div class="stat">
            🍗 <span id="hunger">100</span>
        </div>

        <div class="stat">
            🌳 Gỗ: <span id="wood">0</span>
        </div>

        <div class="stat">
            🪨 Đá: <span id="stone">0</span>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="message">
        🌴 Chào mừng đến đảo hoang! Hãy tìm cây và đá để sinh tồn.
    </div>

    <div id="mobileControls">
        <button id="up">▲</button>

        <div class="middleControls">
            <button id="left">◀</button>
            <button id="down">▼</button>
            <button id="right">▶</button>
        </div>

        <button id="action">⛏️<br>Thu thập</button>
    </div>

</div>

<script src="script.js"></script>
```

</body>
</html>
