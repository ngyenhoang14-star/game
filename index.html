<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinh Tồn Pixel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <!-- GAME -->
        <canvas id="gameCanvas"></canvas>

        <!-- MÁU VÀ THỂ LỰC -->
        <div id="hud">

            <div class="barBox">
                <div class="barText">❤ <span id="healthText">100/100</span></div>
                <div class="bar healthBar">
                    <div id="healthFill"></div>
                </div>
            </div>

            <div class="barBox">
                <div class="barText">⚡ <span id="energyText">100/100</span></div>
                <div class="bar energyBar">
                    <div id="energyFill"></div>
                </div>
            </div>

        </div>

        <!-- HƯỚNG DẪN -->
        <div id="controls">
            <b>W A S D:</b> Di chuyển<br>
            <b>E:</b> Tương tác<br>
            <b>I:</b> Túi đồ
        </div>

        <!-- HOTBAR -->
        <div id="hotbar">

            <div class="slot selected">1<br>🪓</div>
            <div class="slot">2<br>⛏️</div>
            <div class="slot">3<br></div>
            <div class="slot">4<br></div>
            <div class="slot">5<br></div>
            <div class="slot">6<br></div>
            <div class="slot">7<br></div>
            <div class="slot">8<br></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
