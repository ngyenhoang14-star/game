<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sinh Tồn Pixel</title>

<style>

/* =========================
   CÀI ĐẶT CHUNG
========================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#181818;
    font-family:Arial, sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#315c36;
}

canvas{
    position:absolute;
    width:100%;
    height:100%;
    left:0;
    top:0;
    image-rendering:pixelated;
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    z-index:10;

    width:210px;

    padding:10px;

    background:rgba(32,27,22,.92);
    border:3px solid #6d573c;

    box-shadow:
        0 4px 0 rgba(0,0,0,.5);
}

.barName{
    color:white;
    font-size:13px;
    font-weight:bold;
    margin-top:4px;
    margin-bottom:4px;
}

.bar{
    width:100%;
    height:15px;

    background:#111;
    border:2px solid #201b16;
}

.fill{
    height:100%;
    width:100%;
}

#healthFill{
    background:#d94747;
}

#energyFill{
    background:#d7a52c;
}


/* =========================
   HƯỚNG DẪN PC
========================= */

#help{
    position:absolute;
    right:15px;
    top:15px;

    z-index:10;

    color:#eee;
    font-size:13px;
    line-height:1.7;

    padding:10px 14px;

    background:rgba(32,27,22,.85);
    border:3px solid #6d573c;
}


/* =========================
   HOTBAR
========================= */

#hotbar{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    display:flex;

    z-index:20;

    padding:5px;

    background:rgba(31,27,22,.92);
    border:4px solid #5c4b35;

    box-shadow:
        0 5px 0 rgba(0,0,0,.4);
}

.slot{
    width:62px;
    height:62px;

    margin:1px;

    color:white;
    font-size:11px;

    background:#3d352a;
    border:2px solid #79664a;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}

.slot.selected{
    background:#67563d;
    border-color:#e2c271;
}

.item{
    font-size:25px;
}


/* =========================
   THÔNG BÁO
========================= */

#message{
    position:absolute;

    left:50%;
    top:70px;

    transform:translateX(-50%);

    z-index:20;

    color:white;

    padding:8px 16px;

    background:rgba(20,20,20,.75);

    border:2px solid #5e4d37;

    pointer-events:none;
}


/* =========================
   NÚT ĐIỀU KHIỂN ĐIỆN THOẠI
========================= */

#mobileControls{
    display:none;

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:230px;

    z-index:50;

    pointer-events:none;
}

#joystick{
    position:absolute;

    left:25px;
    bottom:25px;

    width:150px;
    height:150px;

    pointer-events:auto;
}

.moveBtn{
    position:absolute;

    width:52px;
    height:52px;

    border:none;

    color:white;
    font-size:25px;
    font-weight:bold;

    background:rgba(45,45,45,.82);

    border:3px solid rgba(150,150,150,.5);

    border-radius:12px;

    box-shadow:
        0 4px 0 rgba(0,0,0,.4);

    touch-action:none;

    user-select:none;
}

.moveBtn:active{
    transform:translateY(3px);
    background:rgba(90,90,90,.9);
}

#up{
    left:49px;
    top:0;
}

#left{
    left:0;
    top:49px;
}

#right{
    right:0;
    top:49px;
}

#down{
    left:49px;
    bottom:0;
}


/* =========================
   NÚT HÀNH ĐỘNG
========================= */

#actions{
    position:absolute;

    right:25px;
    bottom:30px;

    display:flex;
    flex-direction:column;
    gap:10px;

    pointer-events:auto;
}

.actionBtn{
    width:68px;
    height:68px;

    border-radius:50%;

    border:3px solid rgba(190,190,190,.5);

    background:rgba(50,50,50,.85);

    color:white;
    font-size:28px;

    box-shadow:
        0 4px 0 rgba(0,0,0,.45);

    touch-action:none;
}

.actionBtn:active{
    transform:translateY(3px);
    background:rgba(100,100,100,.9);
}


/* =========================
   ĐIỆN THOẠI
========================= */

@media(max-width:700px){

    #mobileControls{
        display:block;
    }

    #help{
        display:none;
    }

    #hud{
        top:8px;
        left:8px;

        width:155px;

        transform:scale(.85);
        transform-origin:top left;
    }

    #message{
        top:8px;

        font-size:12px;

        max-width:180px;

        text-align:center;
    }

    #hotbar{
        bottom:8px;

        transform:
        translateX(-50%)
        scale(.72);

        transform-origin:bottom center;
    }

    .slot{
        width:55px;
        height:55px;
    }
}

</style>
</head>


<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="barName">
            ❤️ Máu: <span id="healthText">100</span>/100
        </div>

        <div class="bar">
            <div class="fill" id="healthFill"></div>
        </div>


        <div class="barName">
            ⚡ Thể lực: <span id="energyText">100</span>/100
        </div>

        <div class="bar">
            <div class="fill" id="energyFill"></div>
        </div>

    </div>


    <!-- HƯỚNG DẪN -->

    <div id="help">
        <b>W A S D</b> Di chuyển<br>
        <b>Chuột / Phím E</b> Hành động<br>
        <b>1 - 4</b> Chọn đồ
    </div>


    <div id="message">
        🌲 Khám phá thế giới hoang dã!
    </div>


    <!-- HOTBAR -->

    <div id="hotbar">

        <div class="slot selected">
            <span>1</span>
            <span class="item">🪓</span>
        </div>

        <div class="slot">
            <span>2</span>
            <span class="item">⛏️</span>
        </div>

        <div class="slot">
            <span>3</span>
            <span class="item">🌱</span>
        </div>

        <div class="slot">
            <span>4</span>
            <span class="item">🪵</span>
        </div>

        <div class="slot">
            <span>5</span>
        </div>

        <div class="slot">
            <span>6</span>
        </div>

    </div>


    <!-- ĐIỀU KHIỂN ĐIỆN THOẠI -->

    <div id="mobileControls">

        <div id="joystick">

            <button class="moveBtn" id="up">▲</button>
            <button class="moveBtn" id="left">◀</button>
            <button class="moveBtn" id="right">▶</button>
            <button class="moveBtn" id="down">▼</button>

        </div>


        <div id="actions">

            <button class="actionBtn" id="inventory">
                🎒
            </button>

            <button class="actionBtn" id="action">
                🪓
            </button>

        </div>

    </div>

</div>


<script>

/* =================================
   CANVAS
================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;


function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

window.addEventListener("resize", resize);
resize();



/* =================================
   NHÂN VẬT
================================= */

const player = {

    x:0,
    y:0,

    speed:3.4,

    health:100,
    energy:100,

    direction:"down",

    moving:false,

    animation:0,

    idleAnimation:0,

    actionAnimation:0

};



/* =================================
   BÀN PHÍM
================================= */

const keys = {

    up:false,
    down:false,
    left:false,
    right:false

};


document.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if(key === "w") keys.up = true;
    if(key === "s") keys.down = true;
    if(key === "a") keys.left = true;
    if(key === "d") keys.right = true;

    if(key === "e") useTool();

});


document.addEventListener("keyup", e => {

    const key = e.key.toLowerCase();

    if(key === "w") keys.up = false;
    if(key === "s") keys.down = false;
    if(key === "a") keys.left = false;
    if(key === "d") keys.right = false;

});



/* =================================
   NÚT CẢM ỨNG
================================= */

function addMoveButton(id, direction){

    const button = document.getElementById(id);

    function start(e){

        e.preventDefault();

        keys[direction] = true;

    }

    function stop(e){

        e.preventDefault();

        keys[direction] = false;

    }

    button.addEventListener("pointerdown", start);

    button.addEventListener("pointerup", stop);

    button.addEventListener("pointercancel", stop);

    button.addEventListener("pointerleave", stop);

}


addMoveButton("up", "up");
addMoveButton("down", "down");
addMoveButton("left", "left");
addMoveButton("right", "right");


document.getElementById("action")
.addEventListener("pointerdown", e => {

    e.preventDefault();

    useTool();

});


document.getElementById("inventory")
.addEventListener("pointerdown", e => {

    e.preventDefault();

    showMessage("🎒 Túi đồ sẽ được nâng cấp ở bước tiếp theo!");

});



/* =================================
   RANDOM ỔN ĐỊNH
================================= */

function random(x, y, seed=1){

    const value = Math.sin(
        x * 12.9898 +
        y * 78.233 +
        seed * 37.719
    ) * 43758.5453;

    return value - Math.floor(value);

}



/* =================================
   NOISE TỰ NHIÊN
================================= */

function smoothNoise(x, y, scale, seed){

    const x0 = Math.floor(x / scale);
    const y0 = Math.floor(y / scale);

    const x1 = x0 + 1;
    const y1 = y0 + 1;

    const tx = x / scale - x0;
    const ty = y / scale - y0;

    const a = random(x0, y0, seed);
    const b = random(x1, y0, seed);
    const c = random(x0, y1, seed);
    const d = random(x1, y1, seed);

    const top = a + (b-a) * tx;
    const bottom = c + (d-c) * tx;

    return top + (bottom-top) * ty;

}



/* =================================
   BIOME
================================= */

function getBiome(x, y){

    const n = smoothNoise(
        x,
        y,
        1100,
        20
    );

    if(n > 0.67){
        return "forest";
    }

    if(n > 0.48){
        return "grass";
    }

    if(n > 0.31){
        return "rocky";
    }

    return "meadow";

}



/* =================================
   SÔNG UỐN CONG
================================= */

function isRiver(x, y){

    const riverY =

        Math.sin(x / 600) * 160 +

        Math.sin(x / 210) * 70 +

        Math.sin(x / 1300) * 280;

    const distance = Math.abs(y - riverY);

    return distance < 70;

}



/* =================================
   DI CHUYỂN
================================= */

function updatePlayer(){

    let mx = 0;
    let my = 0;


    if(keys.up){

        my -= 1;
        player.direction = "up";

    }

    if(keys.down){

        my += 1;
        player.direction = "down";

    }

    if(keys.left){

        mx -= 1;
        player.direction = "left";

    }

    if(keys.right){

        mx += 1;
        player.direction = "right";

    }


    player.moving = mx !== 0 || my !== 0;


    if(mx !== 0 && my !== 0){

        mx *= 0.707;
        my *= 0.707;

    }


    player.x += mx * player.speed;
    player.y += my * player.speed;


    if(player.moving){

        player.animation += 0.18;

        player.energy -= 0.015;

    }

    else{

        player.idleAnimation += 0.04;

        player.energy += 0.03;

    }


    if(player.energy > 100){
        player.energy = 100;
    }

    if(player.energy < 0){
        player.energy = 0;
    }


    if(player.actionAnimation > 0){
        player.actionAnimation -= 0.08;
    }

}



/* =================================
   VẼ MẶT ĐẤT
================================= */

function drawGround(){

    const size = 16;

    const startX =
        Math.floor(
            (player.x - canvas.width/2) / size
        ) - 2;

    const startY =
        Math.floor(
            (player.y - canvas.height/2) / size
        ) - 2;

    const endX =
        startX +
        Math.ceil(canvas.width / size) + 4;

    const endY =
        startY +
        Math.ceil(canvas.height / size) + 4;


    for(let ty=startY; ty<endY; ty++){

        for(let tx=startX; tx<endX; tx++){

            const wx = tx * size;
            const wy = ty * size;

            const sx =
                Math.floor(
                    wx - player.x + canvas.width/2
                );

            const sy =
                Math.floor(
                    wy - player.y + canvas.height/2
                );


            /* NƯỚC */

            if(isRiver(wx, wy)){

                const wave =
                    Math.sin(
                        (wx + Date.now()/6) / 25
                    );

                ctx.fillStyle =
                    wave > 0
                    ? "#367da0"
                    : "#2e7094";

                ctx.fillRect(
                    sx,
                    sy,
                    size+1,
                    size+1
                );


                /* Sóng */

                if(random(tx,ty,5) > 0.78){

                    ctx.fillStyle =
                        "rgba(170,220,230,.45)";

                    ctx.fillRect(
                        sx+3,
                        sy+7,
                        7,
                        2
                    );

                }

                continue;

            }


            const biome =
                getBiome(wx, wy);

            let color = "#579543";


            if(biome === "forest"){
                color = "#3f7e39";
            }

            if(biome === "grass"){
                color = "#599b45";
            }

            if(biome === "rocky"){
                color = "#6d8754";
            }

            if(biome === "meadow"){
                color = "#72aa4e";
            }


            ctx.fillStyle = color;

            ctx.fillRect(
                sx,
                sy,
                size+1,
                size+1
            );


            const r =
                random(tx,ty,1);


            /* CỎ NHỎ */

            if(r > 0.78){

                ctx.fillStyle =
                    "rgba(35,100,35,.5)";

                ctx.fillRect(
                    sx+3,
                    sy+8,
                    2,
                    5
                );

                ctx.fillRect(
                    sx+7,
                    sy+5,
                    2,
                    8
                );

            }


            /* HOA */

            if(r > 0.975){

                ctx.fillStyle="#e9e2d2";

                ctx.fillRect(
                    sx+5,
                    sy+5,
                    4,
                    4
                );

                ctx.fillStyle="#f1c94f";

                ctx.fillRect(
                    sx+6,
                    sy+6,
                    2,
                    2
                );

            }

        }
    }

}



/* =================================
   VẼ CÂY PIXEL
================================= */

function drawTree(x, y, type){

    /* BÓNG */

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fillRect(
        x-24,
        y+14,
        48,
        10
    );


    /* THÂN */

    ctx.fillStyle="#3f2718";

    ctx.fillRect(
        x-6,
        y-2,
        12,
        27
    );

    ctx.fillStyle="#71462a";

    ctx.fillRect(
        x-3,
        y,
        6,
        23
    );


    /* CÂY LOẠI 1 */

    if(type === 1){

        ctx.fillStyle="#173e25";

        ctx.fillRect(x-24,y-30,48,25);
        ctx.fillRect(x-18,y-42,36,17);
        ctx.fillRect(x-11,y-50,22,12);

        ctx.fillStyle="#28683a";

        ctx.fillRect(x-21,y-28,42,21);
        ctx.fillRect(x-14,y-39,28,16);

        ctx.fillStyle="#438a49";

        ctx.fillRect(x-15,y-31,14,12);
        ctx.fillRect(x+4,y-34,12,14);
        ctx.fillRect(x-3,y-45,10,8);

        ctx.fillStyle="#67a956";

        ctx.fillRect(x-11,y-27,5,5);
        ctx.fillRect(x+9,y-23,5,5);

    }


    /* CÂY LOẠI 2 */

    else{

        ctx.fillStyle="#1b4828";

        ctx.fillRect(x-20,y-28,40,27);
        ctx.fillRect(x-12,y-42,24,18);

        ctx.fillStyle="#34763e";

        ctx.fillRect(x-17,y-25,34,21);
        ctx.fillRect(x-10,y-38,20,15);

        ctx.fillStyle="#57974d";

        ctx.fillRect(x-9,y-30,12,10);
        ctx.fillRect(x+4,y-23,8,8);

    }

}



/* =================================
   VẼ ĐÁ
================================= */

function drawRock(x,y,size){

    /* BÓNG */

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fillRect(
        x-size,
        y+size/2,
        size*2+5,
        size/2
    );


    /* ĐÁ TỐI */

    ctx.fillStyle="#3d464b";

    ctx.fillRect(
        x-size,
        y-size/2,
        size*2,
        size*1.5
    );

    ctx.fillRect(
        x-size/2,
        y-size,
        size,
        size*2
    );


    /* ĐÁ CHÍNH */

    ctx.fillStyle="#657176";

    ctx.fillRect(
        x-size+3,
        y-size/2+3,
        size*2-6,
        size
    );

    ctx.fillRect(
        x-size/2+2,
        y-size+3,
        size-4,
        size*1.5
    );


    /* ÁNH SÁNG */

    ctx.fillStyle="#9aa3a3";

    ctx.fillRect(
        x-size/2,
        y-size/2,
        size/2,
        size/3
    );

}



/* =================================
   BỤI CÂY
================================= */

function drawBush(x,y){

    /* BÓNG */

    ctx.fillStyle =
        "rgba(0,0,0,.16)";

    ctx.fillRect(
        x-15,
        y+7,
        30,
        7
    );


    ctx.fillStyle="#245d30";

    ctx.fillRect(x-12,y-9,24,18);
    ctx.fillRect(x-16,y-3,32,12);


    ctx.fillStyle="#438a43";

    ctx.fillRect(x-9,y-12,12,10);
    ctx.fillRect(x+2,y-9,11,9);


    /* Quả */

    if(random(
        Math.floor(x),
        Math.floor(y),
        90
    ) > 0.5){

        ctx.fillStyle="#bd4b47";

        ctx.fillRect(x-5,y-3,3,3);
        ctx.fillRect(x+6,y+2,3,3);

    }

}



/* =================================
   VẼ THẾ GIỚI TỰ NHIÊN
================================= */

function drawNature(){

    const cell = 75;

    const startX =
        Math.floor(
            (player.x-canvas.width/2)/cell
        ) - 2;

    const startY =
        Math.floor(
            (player.y-canvas.height/2)/cell
        ) - 2;

    const endX =
        startX +
        Math.ceil(canvas.width/cell)+4;

    const endY =
        startY +
        Math.ceil(canvas.height/cell)+4;


    for(let cy=startY;cy<endY;cy++){

        for(let cx=startX;cx<endX;cx++){

            const wx =
                cx*cell +
                random(cx,cy,50)*cell;

            const wy =
                cy*cell +
                random(cx,cy,51)*cell;


            if(isRiver(wx,wy)){
                continue;
            }


            const biome =
                getBiome(wx,wy);

            const r =
                random(cx,cy,52);


            const sx =
                Math.floor(
                    wx-player.x+canvas.width/2
                );

            const sy =
                Math.floor(
                    wy-player.y+canvas.height/2
                );


            /* RỪNG */

            if(biome === "forest"){

                if(r > 0.25){

                    const type =
                        random(cx,cy,53)>0.5
                        ? 1 : 2;

                    drawTree(
                        sx,
                        sy,
                        type
                    );

                }

                else if(r > 0.12){

                    drawBush(sx,sy);

                }

            }


            /* ĐỒNG CỎ */

            else if(biome === "grass"){

                if(r > 0.88){

                    drawTree(sx,sy,1);

                }

                else if(r > 0.62){

                    drawBush(sx,sy);

                }

            }


            /* VÙNG ĐÁ */

            else if(biome === "rocky"){

                if(r > 0.38){

                    const size =
                        7+
                        Math.floor(
                            random(cx,cy,54)*9
                        );

                    drawRock(
                        sx,
                        sy,
                        size
                    );

                }

                else if(r > 0.18){

                    drawBush(sx,sy);

                }

            }


            /* ĐỒNG HOA */

            else{

                if(r > 0.93){

                    drawTree(sx,sy,2);

                }

                else if(r > 0.60){

                    drawBush(sx,sy);

                }

            }

        }
    }

}



/* =================================
   VẼ NHÂN VẬT
   ANIMATION ĐI BỘ
================================= */

function drawPlayer(){

    const x =
        Math.floor(canvas.width/2);

    let bounce = 0;
    let leg = 0;
    let arm = 0;


    /* ĐANG ĐI */

    if(player.moving){

        bounce =
            Math.abs(
                Math.sin(player.animation)
            )*2;

        leg =
            Math.sin(player.animation)*4;

        arm =
            -Math.sin(player.animation)*3;

    }


    /* ĐỨNG YÊN VẪN THỞ */

    else{

        bounce =
            Math.sin(
                player.idleAnimation
            )*0.7;

    }


    const y =
        Math.floor(
            canvas.height/2-bounce
        );


    /* BÓNG NHÂN VẬT */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.fillRect(
        x-13,
        canvas.height/2+15,
        26,
        5
    );


    /* CHÂN */

    ctx.fillStyle="#24262c";

    ctx.fillRect(
        x-8,
        y+8,
        6,
        10+leg
    );

    ctx.fillStyle="#363943";

    ctx.fillRect(
        x+2,
        y+8,
        6,
        10-leg
    );


    /* GIÀY */

    ctx.fillStyle="#17191e";

    ctx.fillRect(
        x-10,
        y+16+leg,
        9,
        3
    );

    ctx.fillRect(
        x+1,
        y+16-leg,
        9,
        3
    );


    /* TAY SAU */

    ctx.fillStyle="#c78362";

    ctx.fillRect(
        x-12,
        y-2+arm,
        4,
        10
    );


    /* ÁO VIỀN */

    ctx.fillStyle="#213b57";

    ctx.fillRect(
        x-10,
        y-6,
        20,
        16
    );


    /* ÁO */

    ctx.fillStyle="#3f6f99";

    ctx.fillRect(
        x-7,
        y-5,
        14,
        14
    );


    /* ÁNH SÁNG ÁO */

    ctx.fillStyle="#5c8fb7";

    ctx.fillRect(
        x-6,
        y-4,
        5,
        10
    );


    /* TAY TRƯỚC */

    ctx.fillStyle="#e1a07b";

    ctx.fillRect(
        x+9,
        y-2-arm,
        4,
        10
    );


    /* CỔ */

    ctx.fillStyle="#c78362";

    ctx.fillRect(
        x-3,
        y-9,
        6,
        5
    );


    /* TÓC SAU */

    ctx.fillStyle="#382418";

    ctx.fillRect(
        x-8,
        y-19,
        16,
        12
    );


    /* ĐẦU */

    ctx.fillStyle="#d18b69";

    ctx.fillRect(
        x-7,
        y-17,
        14,
        12
    );


    /* MẶT SÁNG */

    ctx.fillStyle="#e5aa85";

    ctx.fillRect(
        x-5,
        y-15,
        10,
        8
    );


    /* TÓC */

    ctx.fillStyle="#4a2c1b";

    ctx.fillRect(
        x-8,
        y-20,
        16,
        5
    );

    ctx.fillRect(
        x-8,
        y-16,
        5,
        5
    );


    /* MẮT THEO HƯỚNG */

    ctx.fillStyle="#222";


    if(player.direction === "down"){

        ctx.fillRect(
            x-4,
            y-12,
            2,
            2
        );

        ctx.fillRect(
            x+3,
            y-12,
            2,
            2
        );

    }


    else if(player.direction === "left"){

        ctx.fillRect(
            x-5,
            y-12,
            2,
            2
        );

    }


    else if(player.direction === "right"){

        ctx.fillRect(
            x+4,
            y-12,
            2,
            2
        );

    }


    /* RÌU KHI HÀNH ĐỘNG */

    if(player.actionAnimation > 0){

        const swing =
            Math.sin(
                player.actionAnimation*8
            )*8;


        ctx.fillStyle="#714425";

        ctx.fillRect(
            x+13,
            y+2+swing,
            3,
            17
        );


        ctx.fillStyle="#b7bec0";

        ctx.fillRect(
            x+10,
            y+swing,
            9,
            5
        );

    }

}



/* =================================
   DÙNG CÔNG CỤ
================================= */

function useTool(){

    if(player.energy < 3){

        showMessage(
            "⚡ Bạn quá mệt!"
        );

        return;

    }


    player.actionAnimation = 1;

    player.energy -= 3;

    showMessage(
        "🪓 Bạn đang sử dụng công cụ!"
    );

}



/* =================================
   THÔNG BÁO
================================= */

let messageTimeout;


function showMessage(text){

    const box =
        document.getElementById("message");

    box.textContent = text;

    clearTimeout(messageTimeout);

    messageTimeout =
        setTimeout(() => {

            box.textContent =
                "🌲 Khám phá thế giới hoang dã!";

        },2000);

}



/* =================================
   CẬP NHẬT HUD
================================= */

function updateHUD(){

    document
    .getElementById("healthText")
    .textContent =
        Math.floor(player.health);


    document
    .getElementById("energyText")
    .textContent =
        Math.floor(player.energy);


    document
    .getElementById("healthFill")
    .style.width =
        player.health+"%";


    document
    .getElementById("energyFill")
    .style.width =
        player.energy+"%";

}



/* =================================
   GAME LOOP
================================= */

function gameLoop(){

    updatePlayer();

    drawGround();

    drawNature();

    drawPlayer();

    updateHUD();

    requestAnimationFrame(gameLoop);

}


gameLoop();

</script>
